spring.application.name=ms-spa

# Configuracion de la base de datos R2DBC
spring.r2dbc.url=r2dbc:h2:mem:///tareas_db;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.r2dbc.username=sa
spring.r2dbc.password=password

# Configuracion de la consola H2 (JDBC)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de seguridad JWT
jwt.secret=cl4v3S3cr3t4P4r4G3n3r4rT0k3nJwtNu3v0Sp4G3st10nT4r34s
jwt.expiration=86400000

# Configuracion de OpenAPI y Swagger mejorada
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.spa.controller
springdoc.pathsToMatch=/api/**

# Puerto del servidor
server.port=8080

# Nivel de logs
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc=DEBUG
logging.level.reactor.netty=DEBUG
logging.level.com.spa=DEBUG

# Configuracion de inicializacion de esquema
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Configuracion de Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers,mappings
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Informacion personalizada para el endpoint /info
info.app.name=MS-SPA Gestion de Tareas
info.app.description=Sistema de gestion de tareas para NUEVO SPA
info.app.version=1.0.0